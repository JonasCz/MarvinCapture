# Builds the installers for the selected platforms, on demand only (Actions tab >
# "Build" > "Run workflow"). Each platform is built natively on its own GitHub-hosted
# runner, all in parallel (Android is cross-built on Linux); see docs/ci.md for the
# caches, the Android signing key and the release options.
#
# The work is done by the same scripts as a local build (scripts/install-deps.*,
# scripts/package-*.{sh,ps1}, scripts/build-android.sh, scripts/publish-release.sh); this
# file only picks the runners, restores/saves the caches and hands the installers on.

name: Build

on:
  workflow_dispatch:
    inputs:
      windows_x64:
        description: Windows x86_64
        type: boolean
        default: true
      windows_arm64:
        description: Windows arm64
        type: boolean
        default: true
      macos_arm64:
        description: macOS arm64 (Apple Silicon)
        type: boolean
        default: true
      macos_x64:
        description: macOS x86_64 (Intel)
        type: boolean
        default: true
      linux_x64:
        description: Linux x86_64 (.deb)
        type: boolean
        default: true
      linux_arm64:
        description: Linux arm64 (.deb)
        type: boolean
        default: true
      android:
        description: Android arm64 (.apk)
        type: boolean
        default: true
      run_tests:
        description: Run the ctest suite
        type: boolean
        default: false
      publish:
        description: What to do with the installers
        type: choice
        options:
          - artifacts only
          - draft release
          - release
        default: artifacts only
      release_title:
        description: "Release title (empty: MarvinCapture <version>)"
        type: string
        default: ""
      release_notes:
        description: "Release notes (empty: release_notes from VERSION; edit a draft on GitHub for longer text)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  setup:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: plan
        env:
          SELECTED: >-
            windows-x86_64=${{ inputs.windows_x64 }}
            windows-arm64=${{ inputs.windows_arm64 }}
            macos-arm64=${{ inputs.macos_arm64 }}
            macos-x86_64=${{ inputs.macos_x64 }}
            linux-x86_64=${{ inputs.linux_x64 }}
            linux-arm64=${{ inputs.linux_arm64 }}
            android-arm64=${{ inputs.android }}
        run: |
          set -euo pipefail
          # platform -> GitHub-hosted runner
          declare -A runner=(
            [windows-x86_64]=windows-2025   [windows-arm64]=windows-11-arm
            [macos-arm64]=macos-15          [macos-x86_64]=macos-15-intel
            [linux-x86_64]=ubuntu-22.04     [linux-arm64]=ubuntu-22.04-arm
            [android-arm64]=ubuntu-24.04    # has JDK 17, the SDK and the pinned NDK preinstalled
          )
          m='[]'
          for sel in $SELECTED; do
            p="${sel%=*}"
            [[ "${sel#*=}" == true ]] || continue
            m="$(jq -c --arg p "$p" --arg r "${runner[$p]}" \
              '. + [{platform: $p, runner: $r, os: ($p | split("-")[0]), arch: (if ($p | endswith("arm64")) then "arm64" else "x64" end)}]' <<<"$m")"
          done
          [[ "$m" != '[]' ]] || { echo "::error::No platform selected"; exit 1; }
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version VERSION)" >> "$GITHUB_OUTPUT"

      # Fail before building anything if the release can't be made.
      - if: inputs.publish != 'artifacts only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh --check

      # A release never carries a debug-signed APK: Android only installs an update signed
      # with the same key, so the key of the first published APK is the app's for good.
      - if: inputs.publish != 'artifacts only' && inputs.android
        env:
          HAS_KEY: ${{ secrets.MARVIN_ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          [[ "$HAS_KEY" == true ]] || {
            echo "::error::No Android signing key (secret MARVIN_ANDROID_KEYSTORE_BASE64): a release must not carry a debug-signed APK. Add the key (docs/ci.md, \"Android signing key\") or untick Android."
            exit 1
          }

  build:
    name: ${{ matrix.platform }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SKIP_TESTS: ${{ !inputs.run_tests }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages
    steps:
      - uses: actions/checkout@v5
        with:
          # the macOS app's build number is the commit count
          fetch-depth: ${{ matrix.os == 'macos' && '0' || '1' }}

      # FFmpeg: the static build per platform, keyed on build-ffmpeg.sh (whose stamp the
      # build scripts check, so they skip the build on a hit); for Android also on
      # android-ndk.sh (NDK version, API level), which its stamp covers as well. On a miss,
      # the source tarball comes from a cache shared by all platforms.
      - name: Cache FFmpeg build
        if: matrix.os != 'android'
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: third_party/ffmpeg-${{ matrix.platform }}
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Cache FFmpeg build (Android)
        if: matrix.os == 'android'
        id: ffmpeg-android-cache
        uses: actions/cache@v5
        with:
          path: third_party/ffmpeg-${{ matrix.platform }}
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/android-ndk.sh') }}

      - name: Cache FFmpeg source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && steps.ffmpeg-android-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: third_party/ffmpeg-src/*.tar.xz
          key: ffmpeg-src-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          restore-keys: ffmpeg-src-
          enableCrossOsArchive: true

      # --- macOS / Linux ---------------------------------------------------------------
      # With the tests on, also the ffmpeg command-line tool (--tests): the ctest suite makes its
      # test recordings with it, and fails rather than skips without it (CI is set).
      - name: Install dependencies
        if: matrix.os == 'macos' || matrix.os == 'linux'
        run: scripts/install-deps.sh $([[ "$SKIP_TESTS" == true ]] || echo --tests)

      - name: Build and package
        if: matrix.os == 'macos' || matrix.os == 'linux'
        run: scripts/package-${{ matrix.os }}.sh $([[ "$SKIP_TESTS" == true ]] && echo --skip-tests)

      # --- Android ---------------------------------------------------------------------
      # Nothing to install: ubuntu-24.04 has JDK 17 (default), ANDROID_HOME with
      # platforms;android-36 and build-tools;36.0.0, the NDK pinned in android-ndk.sh,
      # cmake, ninja and pkg-config. Only arm64-v8a (the phones); no tests (the core's
      # ctest suite cannot run on an Android target here).
      #
      # libusb: build-android-native.sh rebuilds it when its stamp (libusb version, NDK,
      # API level) no longer matches, so an older cache is restored when the key misses.
      - name: Cache libusb (Android)
        if: matrix.os == 'android'
        uses: actions/cache@v5
        with:
          path: third_party/libusb-${{ matrix.platform }}
          key: libusb-${{ matrix.platform }}-${{ hashFiles('scripts/build-android-native.sh', 'scripts/android-ndk.sh') }}
          restore-keys: libusb-${{ matrix.platform }}-

      # Gradle (from the wrapper) and the Android Gradle plugin's downloads. Not the
      # wrapper's zip (the unpacked distribution is enough) nor the build cache.
      - name: Cache Gradle
        if: matrix.os == 'android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            !~/.gradle/wrapper/dists/*/*/*.zip
            !~/.gradle/caches/build-cache-*
          key: gradle-${{ hashFiles('gui/android/gradle/wrapper/gradle-wrapper.properties', 'gui/android/**/*.gradle', 'gui/android/gradle.properties') }}
          restore-keys: gradle-

      # Release signing from the secrets (docs/ci.md, "Android signing key"); without them
      # the APK gets a throw-away debug key, which is fine for testing only.
      - name: Build the APK
        if: matrix.os == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.MARVIN_ANDROID_KEYSTORE_BASE64 }}
          MARVIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MARVIN_ANDROID_KEYSTORE_PASSWORD }}
          MARVIN_ANDROID_KEY_ALIAS: ${{ secrets.MARVIN_ANDROID_KEY_ALIAS }}
          MARVIN_ANDROID_KEY_PASSWORD: ${{ secrets.MARVIN_ANDROID_KEY_PASSWORD }}
          # The runner's ANDROID_NDK_HOME is its default NDK, not the pinned one: unset, the
          # scripts take only the pinned version under ANDROID_HOME (or fail).
          ANDROID_NDK_HOME: ""
          # one build, no daemon left running while the Gradle cache is saved
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            export MARVIN_ANDROID_KEYSTORE="$RUNNER_TEMP/marvin-release.keystore"
            base64 -d <<<"$KEYSTORE_BASE64" > "$MARVIN_ANDROID_KEYSTORE"
          else
            echo "::warning title=Debug-signed APK::No MARVIN_ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throw-away debug key. Fine for testing; never publish it (docs/ci.md, \"Android signing key\")."
          fi
          scripts/build-android.sh --release --abi arm64-v8a

      # --- Windows ---------------------------------------------------------------------
      # setup-msys2 only installs MSYS2 itself; the packages come from install-deps.ps1,
      # with pacman's download cache kept in an Actions cache.
      - name: Set up MSYS2
        if: matrix.os == 'windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'UCRT64' }}
          update: false
          cache: false

      # a separate entry with the tests on: it holds ffmpeg and its dependencies as well
      - name: Cache MSYS2 packages
        if: matrix.os == 'windows'
        uses: actions/cache@v5
        with:
          path: ${{ steps.msys2.outputs.msys2-location }}\var\cache\pacman\pkg
          key: msys2-${{ matrix.platform }}-${{ hashFiles('scripts/install-deps.ps1') }}${{ inputs.run_tests && '-tests' || '' }}
          restore-keys: msys2-${{ matrix.platform }}-

      - name: Set up .NET
        if: matrix.os == 'windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Most NuGet packages (Windows App SDK, toolkit, Vortice) are the same for both
      # architectures, so a new key falls back to the other architecture's cache.
      - name: Cache NuGet packages
        if: matrix.os == 'windows'
        uses: actions/cache@v5
        with:
          path: .nuget-packages
          key: nuget-${{ hashFiles('gui/windows/**/*.csproj', 'gui/windows/Directory.Build.props', 'gui/windows/nuget.config') }}-${{ matrix.arch }}
          restore-keys: |
            nuget-${{ hashFiles('gui/windows/**/*.csproj', 'gui/windows/Directory.Build.props', 'gui/windows/nuget.config') }}-
            nuget-

      # libwdi's wdi-simple.exe, the same file for both architectures (built with MSVC);
      # package-windows.ps1's stamp decides whether the cached one is still current.
      - name: Cache libwdi
        if: matrix.os == 'windows'
        uses: actions/cache@v5
        with:
          path: |
            build/windows-libwdi
            !build/windows-libwdi/work
          key: libwdi-msvc-${{ hashFiles('scripts/package-windows.ps1') }}

      # -Tests (with the tests on): also MSYS2's ffmpeg, next to the toolchain that build.ps1
      # puts on PATH, where ctest finds ffmpeg.exe
      - name: Install dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: scripts/install-deps.ps1 -Arch ${{ matrix.arch }} -Msys2 '${{ steps.msys2.outputs.msys2-location }}' -Refresh -Tests:$($env:SKIP_TESTS -ne 'true')

      - name: Build and package
        if: matrix.os == 'windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Msys2 '${{ steps.msys2.outputs.msys2-location }}' -SkipTests:$($env:SKIP_TESTS -eq 'true')

      # --- Result ----------------------------------------------------------------------
      # The installer itself is the artifact, not a zip of it (actions/upload-artifact v7, archive: false:
      # one file; the artifact is named after the file). Every platform makes exactly one.
      - name: Pick the installer
        id: installer
        shell: bash
        run: |
          shopt -s nullglob
          files=(build/${{ matrix.platform }}/installer/*.exe build/${{ matrix.platform }}/installer/*.pkg \
                 build/${{ matrix.platform }}/installer/*.deb build/android/*.apk)
          [[ ${#files[@]} -eq 1 ]] || { echo "expected exactly one installer, found ${#files[@]}: ${files[*]}" >&2; exit 1; }
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: [setup, build]
    if: inputs.publish != 'artifacts only'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/installers
          merge-multiple: true

      # publish-release.sh looks for the installers directly in the folder; make sure none ended up in a
      # sub-folder named after its artifact
      - name: Flatten the downloads
        run: |
          find "$RUNNER_TEMP/installers" -mindepth 2 -type f \( -name '*.exe' -o -name '*.pkg' -o -name '*.deb' -o -name '*.apk' \) \
            -exec mv -t "$RUNNER_TEMP/installers" {} +
          ls -l "$RUNNER_TEMP/installers"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.release_title }}
          NOTES: ${{ inputs.release_notes }}
          DRAFT: ${{ inputs.publish == 'draft release' }}
        run: |
          scripts/publish-release.sh --title "$TITLE" --notes "$NOTES" \
            $([[ "$DRAFT" == true ]] && echo --draft) "$RUNNER_TEMP/installers" | tee -a "$GITHUB_STEP_SUMMARY"
